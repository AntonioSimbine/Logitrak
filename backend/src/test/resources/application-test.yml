spring:
  datasource:
    url: jdbc:h2:mem:logitrack;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

server:
  port: 0

logitrack:
  jwt:
    secret: logitrack-test-secret-only-for-automated-tests-2026-0123456789abcdef
    expiration-minutes: 60
  cors:
    allowed-origins: http://localhost:*
  upload-dir: target/test-uploads
  sla:
    intervalo-ms: 3600000
    atraso-inicial-ms: 3600000
  demo-seed: true
  demo:
    password: test-demo-password-only-for-tests

logging:
  level:
    root: WARN
    mz.co.logitrack: WARN
    org.hibernate: WARN
    org.springframework: WARN
