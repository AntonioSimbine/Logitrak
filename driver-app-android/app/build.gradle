plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.parcelize' // Sintaxe atualizada para evitar o conflito
    id 'com.google.devtools.ksp'
}

// A chave de assinatura fica fora do controlo de versões (local.properties + *.jks).
def propriedadesAssinatura = new Properties()
def ficheiroPropriedades = rootProject.file('local.properties')
if (ficheiroPropriedades.exists()) {
    ficheiroPropriedades.withInputStream { propriedadesAssinatura.load(it) }
}
def caminhoKeystore = propriedadesAssinatura['release.storeFile']

android {
    namespace 'mz.co.logitrack.motorista'
    compileSdk 34

    defaultConfig {
        applicationId "mz.co.logitrack.motorista"
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "1.8"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Endereço inicial da API. Pode ser trocado na app (ecrã de login > Servidor)
        // ou no build: gradlew assembleDebug -PapiBase=https://a-tua-api.exemplo.com
        def apiBase = (project.findProperty('apiBase') ?: 'https://api-production-938e6a7a.up.railway.app').toString()
        buildConfigField 'String', 'API_BASE_PADRAO', "\"${apiBase}\""

        // Endereço do site que publica o aviso e o APK da aplicação.
        def webBase = (project.findProperty('webBase') ?: 'https://web-production-f93e366a.up.railway.app').toString()
        buildConfigField 'String', 'WEB_BASE_PADRAO', "\"${webBase}\""
    }

    signingConfigs {
        release {
            if (caminhoKeystore) {
                storeFile rootProject.file(caminhoKeystore)
                storePassword propriedadesAssinatura['release.storePassword']
                keyAlias propriedadesAssinatura['release.keyAlias']
                keyPassword propriedadesAssinatura['release.keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sem keystore própria, usa a mesma chave das APKs já publicadas:
            // assim a atualização dentro da app é aceite pelo Android.
            if (caminhoKeystore) signingConfig signingConfigs.release
            else signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.fragment:fragment-ktx:1.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.6'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.2'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Retrofit + OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // CameraX
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'

    // Play Services Location
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Leitura da orientação EXIF das fotografias
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Gson
    implementation 'com.google.code.gson:gson:2.11.0'

    // Testes locais da lógica de segurança (sem dispositivo)
    testImplementation 'junit:junit:4.13.2'
}
